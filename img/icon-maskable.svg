<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="40%" stop-color="#0d2847"/>
      <stop offset="100%" stop-color="#061222"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7dd3ff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#4a9eff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1a5fa8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#4a9eff" stroke-width="2" opacity="0.4" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#5cb0ff" stroke-width="1.5" opacity="0.55" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="#6ec4ff" stroke-width="1.2" opacity="0.7" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="60" fill="url(#coreGrad)" opacity="0.6" filter="url(#strongGlow)"/>
  <circle cx="256" cy="256" r="22" fill="#7dd3ff" opacity="0.95" filter="url(#strongGlow)"/>
  <circle cx="256" cy="256" r="12" fill="#a8e4ff" opacity="1"/>
  <circle cx="256" cy="256" r="5" fill="#ffffff" opacity="0.9"/>
</svg>
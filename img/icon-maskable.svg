<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="0" fill="#0a1a2e"/>
  
  <!-- Outer ring (filled blue band) -->
  <circle cx="256" cy="256" r="220" fill="#2d7fd4" opacity="0.35" filter="url(#g)"/>
  <circle cx="256" cy="256" r="190" fill="#0a1a2e"/>
  
  <!-- Middle ring -->
  <circle cx="256" cy="256" r="190" fill="#4a9eff" opacity="0.5" filter="url(#g)"/>
  <circle cx="256" cy="256" r="155" fill="#0a1a2e"/>
  
  <!-- Inner ring -->
  <circle cx="256" cy="256" r="155" fill="#7dd3ff" opacity="0.65" filter="url(#g)"/>
  <circle cx="256" cy="256" r="115" fill="#0a1a2e"/>
  
  <!-- Core -->
  <circle cx="256" cy="256" r="115" fill="#a8e4ff" opacity="0.4" filter="url(#g)"/>
  <circle cx="256" cy="256" r="80" fill="#7dd3ff" opacity="0.9" filter="url(#g)"/>
  <circle cx="256" cy="256" r="55" fill="#a8e4ff" opacity="1"/>
  <circle cx="256" cy="256" r="30" fill="#ffffff" opacity="0.95"/>
  
  
</svg>
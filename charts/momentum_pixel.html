<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>html,body{margin:0;padding:0;background:#1e293b;font-family:Inter,system-ui,sans-serif}#chart{width:100%;height:400px}</style>
</head><body><div id="chart"></div>
<script>
var F = [10,50,100,500,1000,5000,10000,50000,100000,500000,1000000];
var standard = [100,500,1000,5000,10000,50000,100000,500000,1000000,5000000,10000000];
var dream = [100,500,1000,5000,10000,10000,10000,10000,10000,10000,10000];
var chart = echarts.init(document.getElementById('chart'), 'dark');
chart.setOption({
  backgroundColor: 'transparent',
  title: {text: 'Momentum Pixel (Fabry-Perot) — PREDICTION', left: 'center', top: 10,
    textStyle: {color: '#e2e8f0', fontSize: 13, fontWeight: 600}},
  tooltip: {trigger: 'axis',
    backgroundColor: 'rgba(15,23,42,.95)', borderColor: '#3b4f7a',
    textStyle: {color: '#e2e8f0', fontSize: 11}},
  legend: {top: 35, textStyle: {color: '#cfd4ff', fontSize: 10},
    data: ['Standard (no pixel)', 'DREAM (momentum pixel at F=1000)']},
  grid: {left: 60, right: 20, top: 80, bottom: 40},
  xAxis: {type: 'log', name: 'Cavity Finesse F', nameLocation: 'middle', nameGap: 25,
    axisLabel: {color: '#94a3b8'}, nameTextStyle: {color: '#94a3b8'},
    axisLine: {lineStyle: {color: '#3b4f7a'}}},
  yAxis: {type: 'log', name: 'Resolvable Modes',
    nameLocation: 'middle', nameGap: 35,
    axisLabel: {color: '#94a3b8'}, nameTextStyle: {color: '#94a3b8'},
    axisLine: {lineStyle: {color: '#3b4f7a'}},
    splitLine: {lineStyle: {color: 'rgba(120,140,200,.3)', type: 'dashed'}}},
  series: [
    {name: 'Standard (no pixel)', type: 'line', data: standard, smooth: true,
      itemStyle: {color: '#f0a0a0'}, lineStyle: {width: 2, color: '#f0a0a0'},
      symbol: 'circle', symbolSize: 6},
    {name: 'DREAM (momentum pixel at F=1000)', type: 'line', data: dream, smooth: true,
      itemStyle: {color: '#8ec5e8'}, lineStyle: {width: 2, color: '#8ec5e8'},
      symbol: 'square', symbolSize: 6}
  ],
  animationDuration: 1000
});
window.addEventListener('resize', function() { chart.resize(); });
</script></body></html>

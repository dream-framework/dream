<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>html,body{margin:0;padding:0;background:#1e293b;font-family:Inter,system-ui,sans-serif}#chart{width:100%;height:400px}</style>
</head><body><div id="chart"></div>
<script>
var data = {"Hydrogen (Balmer)":[20,22,22,22,23,23,23,23,23,23,23],"Mercury (Hg I)":[20,22,22,22,23,23,23,23,23,23,23],"Iron (Fe I, ~3000 lines)":[277,508,861,1501,1987,2407,2741,2855,2925,2969,2987],"Neon (Ne I, ~900 lines)":[87,156,267,469,616,717,820,856,883,893,897]};
var R = [500,1000,2000,5000,10000,20000,50000,100000,200000,500000,1000000];
var colors = ['#f0c878','#7dd3a8','#8ec5e8','#f0a0a0'];
var series = Object.keys(data).map(function(name, i) {
  return {name: name, type: 'line', data: data[name], smooth: true,
    itemStyle: {color: colors[i]}, lineStyle: {width: 2, color: colors[i]},
    symbol: 'circle', symbolSize: 6};
});
var chart = echarts.init(document.getElementById('chart'), 'dark');
chart.setOption({
  backgroundColor: 'transparent',
  title: {text: 'Spectral Pixel Test: resolvable lines vs resolving power', left: 'center', top: 10,
    textStyle: {color: '#e2e8f0', fontSize: 13, fontWeight: 600}},
  tooltip: {trigger: 'axis',
    backgroundColor: 'rgba(15,23,42,.95)', borderColor: '#3b4f7a',
    textStyle: {color: '#e2e8f0', fontSize: 11}},
  legend: {top: 35, textStyle: {color: '#cfd4ff', fontSize: 10}},
  grid: {left: 60, right: 20, top: 80, bottom: 40},
  xAxis: {type: 'log', name: 'Resolving Power R', nameLocation: 'middle', nameGap: 25,
    axisLabel: {color: '#94a3b8'}, nameTextStyle: {color: '#94a3b8'},
    axisLine: {lineStyle: {color: '#3b4f7a'}}},
  yAxis: {type: 'value', name: 'Resolvable Features',
    nameLocation: 'middle', nameGap: 35,
    axisLabel: {color: '#94a3b8'}, nameTextStyle: {color: '#94a3b8'},
    axisLine: {lineStyle: {color: '#3b4f7a'}},
    splitLine: {lineStyle: {color: 'rgba(120,140,200,.3)', type: 'dashed'}}},
  series: series,
  animationDuration: 1000
});
window.addEventListener('resize', function() { chart.resize(); });
</script></body></html>

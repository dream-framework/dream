<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DREAM Zoom — Projection Scale Toy</title>
<link rel="apple-touch-icon" href="/dream/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/dream/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/dream/img/favicon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DREAM Zoom">
<meta name="theme-color" content="#070b14">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#070b14;color:#eef2f7;font:14px/1.4 system-ui,sans-serif}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid #223047;background:rgba(10,15,26,.85);z-index:10}
header h1{font-size:15px;font-weight:700}
header .sub{color:#a8b3c7;font-size:11px}
header .home{margin-left:auto;font-size:12px;color:#60a5fa;text-decoration:none}
#scene-container{position:relative;overflow:hidden;min-height:0}
#three-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}
#hud{position:absolute;top:8px;left:8px;display:flex;gap:5px;z-index:5;pointer-events:none}
.pill{font-size:10px;padding:3px 8px;border-radius:999px;border:1px solid #223047;background:rgba(7,11,20,.88);font-weight:600}
.pill .v{color:#2dd4bf;font-family:monospace}
.pill .label{color:#a8b3c7}
#narrative{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:90%;max-width:600px;z-index:5;pointer-events:none}
.narr-panel{background:rgba(7,11,20,.92);border:1px solid #223047;border-radius:12px;padding:10px 16px;font-size:13px;line-height:1.5;opacity:0;transition:opacity .4s}
.narr-panel.visible{opacity:1}
.narr-panel .ntitle{color:#2dd4bf;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.narr-panel .nbody{color:#eef2f7}
.narr-panel .nmath{color:#60a5fa;font-family:monospace;margin-top:6px;font-size:11px}
#debug{position:absolute;top:40px;left:8px;z-index:5;font-size:10px;color:#fca5a5;font-family:monospace;max-width:90%;display:none}
footer{border-top:1px solid #223047;background:rgba(10,15,26,.95);padding:10px 14px;z-index:10}
#scale-row{display:flex;align-items:center;gap:10px;max-width:900px;margin:0 auto}
#scale-slider{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:6px;background:linear-gradient(90deg,#2dd4bf,#60a5fa,#fbbf24,#ef4444);outline:none;cursor:pointer}
#scale-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;cursor:grab;border:2px solid #2dd4bf;box-shadow:0 0 8px rgba(45,212,191,.6)}
#scale-slider::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;cursor:grab;border:2px solid #2dd4bf}
#autoplay-btn{padding:5px 12px;border:1px solid #2dd4bf;background:rgba(45,212,191,.12);color:#2dd4bf;border-radius:8px;cursor:pointer;font-size:11px;font-weight:700;white-space:nowrap}
#autoplay-btn.active{background:#2dd4bf;color:#071218}
#level-label{text-align:center;font-size:13px;font-weight:700;margin-top:3px}
#level-label .sub{color:#a8b3c7;font-size:11px;font-weight:400}
#retention-bar{width:100%;max-width:900px;margin:4px auto 0;height:5px;border-radius:5px;background:#1a2a3e;overflow:hidden}
#retention-fill{height:100%;width:100%;border-radius:5px;transition:width .15s,background .3s}
#retention-label{text-align:center;font-size:10px;color:#a8b3c7;margin-top:2px}
#retention-label .v{color:#2dd4bf;font-family:monospace;font-weight:700}
@media(max-width:768px){header h1{font-size:13px}header .sub{display:none}.narr-panel{font-size:12px}}
</style>
</head>
<body>
<div id="app">
  <header><h1>DREAM Zoom</h1><span class="sub">— operate the projection kernel in 3D</span><a class="home" href="/dream/en/index.html">← DREAM</a></header>
  <div id="scene-container">
    <canvas id="three-canvas"></canvas>
    <div id="hud">
      <span class="pill"><span class="label">Scale</span> <span class="v" id="hud-scale">10⁶ m</span></span>
      <span class="pill"><span class="label">R(λ)</span> <span class="v" id="hud-retention">1.000</span></span>
      <span class="pill"><span class="label">D</span> <span class="v" id="hud-d">0.80</span></span>
    </div>
    <div id="debug"></div>
    <div id="narrative"><div class="narr-panel" id="narr-panel">
      <div class="ntitle" id="narr-title">Galaxy</div>
      <div class="nbody" id="narr-body">At macroscopic scales, all structure is preserved. The projection kernel has no effect.</div>
      <div class="nmath" id="narr-math">R(λ) = exp[-(λ/λ_q)^D] ≈ 1.000</div>
    </div></div>
  </div>
  <footer>
    <div id="scale-row">
      <span style="font-size:10px;color:#a8b3c7;white-space:nowrap">MACRO</span>
      <input type="range" id="scale-slider" min="0" max="1000" value="0" step="1">
      <span style="font-size:10px;color:#a8b3c7;white-space:nowrap">λ_q</span>
      <button id="autoplay-btn" class="active">▶ Auto</button>
    </div>
    <div id="level-label"><span id="level-name">Galaxy</span> <span class="sub" id="level-desc">— all structure preserved</span></div>
    <div id="retention-bar"><div id="retention-fill" style="width:100%;background:#2dd4bf"></div></div>
    <div id="retention-label">R(λ) = <span class="v" id="retention-value">1.000</span> — <span id="retention-meaning">all structure preserved</span></div>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
try {
if(typeof THREE==='undefined'){throw new Error('THREE not loaded');}

// ═══ S2 params ═══
var LQ=1e-8, DEFF=0.80;
var LEVELS=[
  {n:'Galaxy',s:6,d:'all structure preserved',t:'At macroscopic scales, all structure is preserved. The projection kernel has no measurable effect.'},
  {n:'Solar System',s:3,d:'all structure preserved',t:'Crossing from galactic to planetary scales. Retention is still essentially unity.'},
  {n:'Earth',s:0,d:'all structure preserved',t:'Continental structure is fully resolved. The kernel is far above the coherence cliff.'},
  {n:'City',s:-2,d:'fine detail emerging',t:'Urban-scale structure emerges. The probe is approaching the regime where finer detail will degrade.'},
  {n:'Room',s:-4,d:'objects visible',t:'Human-scale objects are clearly resolved. The probe is well above λ_q.'},
  {n:'Tabletop',s:-6,d:'surface texture emerging',t:'Surface textures begin to appear. The probe is approaching the coherence cliff.'},
  {n:'Wood Grain',s:-7,d:'fine structure degrading',t:'Wood grain is visible but losing fine detail. R(λ) is dropping — the kernel is erasing sub-resolution structure.'},
  {n:'Fibers',s:-8,d:'structure collapsing',t:'Cellular fiber structure is partially unresolved. Information is being lost rapidly.'},
  {n:'Microstructure',s:-9,d:'nearly unresolved',t:'Only the coarsest features survive. Recoverable information has reached its limit.'},
  {n:'λ_q — Coherence Cliff',s:-10,d:'irrecoverable',t:'Below the coherence cliff, all structure is irrecoverably blurred. What remains is an unresolved field.'},
];
function retR(sl){return Math.max(0,Math.min(1,Math.exp(-Math.pow(Math.pow(10,sl)/LQ,DEFF))));}
function s2sc(sv){return 6-(sv/1000)*16;}
function findLvl(sl){var b=LEVELS[0];for(var i=0;i<LEVELS.length;i++){if(sl<=LEVELS[i].s)b=LEVELS[i];}return b;}
function sup(n){var m={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','.':'·'};return String(Math.round(n*10)/10).split('').map(function(c){return m[c]||c;}).join('');}

// ═══ THREE scene ═══
var container=document.getElementById('scene-container');
var canvas=document.getElementById('three-canvas');
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x070b14);
scene.fog=new THREE.FogExp2(0x070b14,0.002);
var camera=new THREE.PerspectiveCamera(60,1,0.01,5000);
camera.position.set(0,30,180);
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setClearColor(0x070b14);
function resize(){var w=container.clientWidth,h=container.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();

// Strong lighting
scene.add(new THREE.AmbientLight(0x8090b0,0.7));
var dl1=new THREE.DirectionalLight(0xaaccff,1.0);dl1.position.set(50,100,80);scene.add(dl1);
var dl2=new THREE.DirectionalLight(0xffdd88,0.5);dl2.position.set(-50,50,-80);scene.add(dl2);

// ═══ GALAXY ═══
var gPos=new Float32Array(5000*3);
var gCol=new Float32Array(5000*3);
for(var i=0;i<5000;i++){
  var r=Math.pow(Math.random(),0.4)*100;
  var a=Math.random()*Math.PI*2;
  var arm=Math.floor(Math.random()*3)*(Math.PI*2/3);
  var sp=a+r*0.02+arm;
  gPos[i*3]=Math.cos(sp)*r;
  gPos[i*3+1]=(Math.random()-0.5)*12*(1-r/100);
  gPos[i*3+2]=Math.sin(sp)*r;
  var c=new THREE.Color().setHSL(0.55+Math.random()*0.12,0.8,0.35+Math.random()*0.45);
  gCol[i*3]=c.r;gCol[i*3+1]=c.g;gCol[i*3+2]=c.b;
}
var gGeom=new THREE.BufferGeometry();
gGeom.setAttribute('position',new THREE.BufferAttribute(gPos,3));
gGeom.setAttribute('color',new THREE.BufferAttribute(gCol,3));
var galaxy=new THREE.Points(gGeom,new THREE.PointsMaterial({size:2.0,vertexColors:true,transparent:true,opacity:1.0,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(galaxy);

// ═══ EARTH ═══
var eGeom=new THREE.IcosahedronGeometry(50,5);
var eCol=new Float32Array(eGeom.attributes.position.array.length);
for(i=0;i<eGeom.attributes.position.array.length;i+=3){
  var v=new THREE.Vector3(eGeom.attributes.position.array[i],eGeom.attributes.position.array[i+1],eGeom.attributes.position.array[i+2]);
  var n=v.clone().normalize();
  var ns=Math.sin(n.x*3)*Math.cos(n.y*4)*Math.sin(n.z*5)+Math.sin(n.x*8)*0.3;
  if(ns>0.15){eCol[i]=0.15;eCol[i+1]=0.45;eCol[i+2]=0.12;}
  else if(ns>-0.1){eCol[i]=0.35;eCol[i+1]=0.3;eCol[i+2]=0.1;}
  else{eCol[i]=0.04;eCol[i+1]=0.18;eCol[i+2]=0.5;}
}
eGeom.setAttribute('color',new THREE.BufferAttribute(eCol,3));
var earth=new THREE.Mesh(eGeom,new THREE.MeshPhongMaterial({vertexColors:true,transparent:true,opacity:0,flatShading:true,emissive:0x0a1525,shininess:5}));
earth.visible=false;
scene.add(earth);

// ═══ CITY ═══
var city=new THREE.Group();
for(i=0;i<60;i++){
  var h=3+Math.random()*20;
  var w=2+Math.random()*3;
  var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),new THREE.MeshPhongMaterial({color:new THREE.Color().setHSL(0.6,0.25,0.2+Math.random()*0.15),transparent:true,opacity:0}));
  m.position.set((Math.random()-0.5)*80,h/2,(Math.random()-0.5)*80);
  city.add(m);
}
city.visible=false;scene.add(city);

// ═══ ROOM ═══
var room=new THREE.Group();
var wMat=new THREE.MeshPhongMaterial({color:0x4a4038,transparent:true,opacity:0});
var floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),wMat.clone());floor.rotation.x=-Math.PI/2;room.add(floor);
var w1=new THREE.Mesh(new THREE.PlaneGeometry(100,30),wMat.clone());w1.position.set(0,15,-50);room.add(w1);
var w2=new THREE.Mesh(new THREE.PlaneGeometry(100,30),wMat.clone());w2.position.set(-50,15,0);w2.rotation.y=Math.PI/2;room.add(w2);
var tMat=new THREE.MeshPhongMaterial({color:0x8b5a2b,transparent:true,opacity:0});
var table=new THREE.Mesh(new THREE.BoxGeometry(20,0.8,12),tMat);table.position.set(0,12,0);room.add(table);
[[-9,-5],[9,-5],[-9,5],[9,5]].forEach(function(p){var leg=new THREE.Mesh(new THREE.BoxGeometry(0.8,12,0.8),tMat.clone());leg.position.set(p[0],6,p[1]);room.add(leg);});
room.visible=false;scene.add(room);

// ═══ WOOD GRAIN ═══
var woodGrain=new THREE.Group();
for(i=0;i<20;i++){
  var pts=[];var yB=(i-10)*0.4;
  for(var x=-8;x<=8;x+=0.08){var y=yB+Math.sin(x*1.5+i*0.4)*0.25+(Math.random()-0.5)*0.08;pts.push(new THREE.Vector3(x,y,0));}
  var lg=new THREE.BufferGeometry().setFromPoints(pts);
  var lm=new THREE.LineBasicMaterial({color:new THREE.Color().setHSL(0.08,0.5,0.2+i*0.01),transparent:true,opacity:0});
  woodGrain.add(new THREE.Line(lg,lm));
}
woodGrain.visible=false;scene.add(woodGrain);

// ═══ FIBERS ═══
var fPos=new Float32Array(4000*3);var fCol=new Float32Array(4000*3);
for(i=0;i<4000;i++){var fr=Math.random()*10;var fa=Math.random()*Math.PI*2;fPos[i*3]=fr*Math.cos(fa);fPos[i*3+1]=(Math.random()-0.5)*8;fPos[i*3+2]=fr*Math.sin(fa);var fc=new THREE.Color().setHSL(0.08+Math.random()*0.06,0.5,0.25+Math.random()*0.35);fCol[i*3]=fc.r;fCol[i*3+1]=fc.g;fCol[i*3+2]=fc.b;}
var fGeom=new THREE.BufferGeometry();fGeom.setAttribute('position',new THREE.BufferAttribute(fPos,3));fGeom.setAttribute('color',new THREE.BufferAttribute(fCol,3));
var fibers=new THREE.Points(fGeom,new THREE.PointsMaterial({size:0.3,vertexColors:true,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
fibers.visible=false;scene.add(fibers);

// ═══ UNRESOLVED ═══
var uPos=new Float32Array(200*3);
for(i=0;i<200;i++){uPos[i*3]=(Math.random()-0.5)*40;uPos[i*3+1]=(Math.random()-0.5)*40;uPos[i*3+2]=(Math.random()-0.5)*40;}
var uGeom=new THREE.BufferGeometry();uGeom.setAttribute('position',new THREE.BufferAttribute(uPos,3));
var unresolved=new THREE.Points(uGeom,new THREE.PointsMaterial({size:1.5,color:0x506080,transparent:true,opacity:0,depthWrite:false}));
unresolved.visible=false;scene.add(unresolved);

// ═══ VISIBILITY UPDATE ═══
function updateScene(sl,R){
  var sv=parseFloat(slider.value);
  // Camera: z goes from 180 (galaxy) to 20 (fibers)
  var targetZ=180-(sv/1000)*160;
  camera.position.z+=(targetZ-camera.position.z)*0.08;
  camera.position.y=20+(sv/1000)*15;

  // Galaxy: scale > 1
  var gV=Math.max(0,Math.min(1,(sl-1)/2))*R;
  galaxy.material.opacity=gV;
  galaxy.rotation.y+=0.0005;

  // Earth: scale 1 to -2
  var eV=Math.max(0,Math.min(1,Math.min(sl+2,1-sl)/1.5))*R;
  earth.material.opacity=eV;earth.visible=eV>0.01;earth.rotation.y+=0.001;

  // City: scale -1 to -4
  var cV=Math.max(0,Math.min(1,Math.min(sl+4,-1-sl)/2))*R;
  for(i=0;i<city.children.length;i++){city.children[i].material.opacity=cV;city.children[i].visible=cV>0.01;}
  city.visible=cV>0.01;city.rotation.y+=0.0006;

  // Room: scale -3 to -6
  var rV=Math.max(0,Math.min(1,Math.min(sl+6,-3-sl)/2))*R;
  for(i=0;i<room.children.length;i++){room.children[i].material.opacity=rV;room.children[i].visible=rV>0.01;}
  room.visible=rV>0.01;

  // Wood grain: scale -5 to -8
  var wV=Math.max(0,Math.min(1,Math.min(sl+8,-5-sl)/2))*R;
  for(i=0;i<woodGrain.children.length;i++){woodGrain.children[i].material.opacity=wV;woodGrain.children[i].visible=wV>0.01;}
  woodGrain.visible=wV>0.01;

  // Fibers: scale -7 to -9
  var fV=Math.max(0,Math.min(1,Math.min(sl+9,-7-sl)/1.5));
  fibers.material.opacity=fV*R;fibers.material.size=0.2+(1-R)*0.5;fibers.visible=fV>0.01;

  // Unresolved: scale < -8
  var uV=Math.max(0,Math.min(1,(-8-sl)/2));
  unresolved.material.opacity=uV*(1-R)*0.6;unresolved.material.size=1+(1-R)*2;unresolved.visible=uV>0.01;unresolved.rotation.y+=0.0003;

  // Fog + lighting
  scene.fog.density=0.002+(1-R)*0.01;
  dl1.intensity=0.5+R*0.5;
  scene.children[0].intensity=0.4+R*0.3; // ambient
}

// ═══ UI ═══
var slider=document.getElementById('scale-slider');
var autoBtn=document.getElementById('autoplay-btn');
var narrPanel=document.getElementById('narr-panel');
var narrTitle=document.getElementById('narr-title');
var narrBody=document.getElementById('narr-body');
var narrMath=document.getElementById('narr-math');
var hudScale=document.getElementById('hud-scale');
var hudR=document.getElementById('hud-retention');
var hudD=document.getElementById('hud-d');
var retFill=document.getElementById('retention-fill');
var retVal=document.getElementById('retention-value');
var retMeaning=document.getElementById('retention-meaning');
var lvlName=document.getElementById('level-name');
var lvlDesc=document.getElementById('level-desc');
var debugEl=document.getElementById('debug');
var lastLvl='',narrTO=null;

function updateUI(sl,R){
  var lvl=findLvl(sl);
  hudScale.textContent='10'+sup(sl)+' m';
  hudR.textContent=R.toFixed(3);
  hudD.textContent=DEFF.toFixed(2);
  retFill.style.width=(R*100)+'%';
  retVal.textContent=R.toFixed(3);
  var m,c;
  if(R>0.95){m='all structure preserved';c='#2dd4bf';}
  else if(R>0.7){m='fine detail emerging';c='linear-gradient(90deg,#fbbf24,#2dd4bf)';}
  else if(R>0.3){m='fine structure degrading';c='#fbbf24';}
  else if(R>0.05){m='structure collapsing';c='linear-gradient(90deg,#ef4444,#fbbf24)';}
  else{m='irrecoverable — below coherence cliff';c='#ef4444';}
  retMeaning.textContent=m;retFill.style.background=c;
  lvlName.textContent=lvl.n;lvlDesc.textContent='— '+lvl.d;
  if(lvl.n!==lastLvl){
    lastLvl=lvl.n;
    narrTitle.textContent=lvl.n;
    narrBody.textContent=lvl.t;
    narrMath.textContent='R(λ) = exp[-(λ/λ_q)^D] ≈ '+R.toFixed(3);
    narrPanel.classList.add('visible');
    if(narrTO)clearTimeout(narrTO);
    narrTO=setTimeout(function(){narrPanel.classList.remove('visible');},5000);
  }
}

// ═══ ANIMATION ═══
var autoZoom=true;
function animate(){
  requestAnimationFrame(animate);
  if(autoZoom){var v=parseFloat(slider.value)+0.35;if(v>1000)v=0;slider.value=v;}
  var sv=parseFloat(slider.value);
  var sl=s2sc(sv);
  var R=retR(sl);
  updateScene(sl,R);
  updateUI(sl,R);
  renderer.render(scene,camera);
}

// ═══ INTERACTION ═══
slider.addEventListener('input',function(){autoZoom=false;autoBtn.classList.remove('active');});
autoBtn.addEventListener('click',function(){autoZoom=!autoZoom;autoBtn.classList.toggle('active',autoZoom);});
canvas.addEventListener('click',function(){autoZoom=!autoZoom;autoBtn.classList.toggle('active',autoZoom);});

var pD=0;
canvas.addEventListener('touchstart',function(e){if(e.touches.length===2)pD=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:true});
canvas.addEventListener('touchmove',function(e){if(e.touches.length===2&&pD>0){e.preventDefault();var nd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);var d=(nd-pD)/pD;var v=parseFloat(slider.value)-d*60;v=Math.max(0,Math.min(1000,v));slider.value=v;autoZoom=false;autoBtn.classList.remove('active');pD=nd;}},{passive:false});

// Start
animate();
setTimeout(function(){narrPanel.classList.add('visible');},300);
setTimeout(function(){narrPanel.classList.remove('visible');},5000);

} catch(e) {
  document.getElementById('debug').textContent = 'ERROR: ' + e.message;
  document.getElementById('debug').style.display = 'block';
  console.error(e);
}
</script>
</body>
</html>

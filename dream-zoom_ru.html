<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DREAM Zoom - Projection Scale Toy</title>
<link rel="apple-touch-icon" href="/dream/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/dream/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/dream/img/favicon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DREAM Zoom">
<meta name="theme-color" content="#070b14">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#070b14;color:#eef2f7;font:14px/1.4 system-ui,sans-serif}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid #223047;background:rgba(10,15,26,.85);z-index:10}
header h1{font-size:15px;font-weight:700}
header .sub{color:#a8b3c7;font-size:11px}
header .home{margin-left:auto;font-size:12px;color:#60a5fa;text-decoration:none}
#scene-container{position:relative;overflow:hidden;min-height:0}
#three-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:8px;left:8px;display:flex;gap:5px;z-index:5;pointer-events:none}
.pill{font-size:10px;padding:3px 8px;border-radius:999px;border:1px solid #223047;background:rgba(7,11,20,.88);font-weight:600}
.pill .v{color:#2dd4bf;font-family:monospace}
.pill .label{color:#a8b3c7}
#narrative{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:90%;max-width:600px;z-index:5;pointer-events:none}
.narr-panel{background:rgba(7,11,20,.95);border:1px solid #2dd4bf;border-radius:12px;padding:14px 20px;font-size:14px;line-height:1.6;opacity:0;transition:opacity .5s;box-shadow:0 -4px 24px rgba(0,0,0,.4)}
.narr-panel.visible{opacity:1}
.narr-panel .ntitle{color:#2dd4bf;font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.narr-panel .nbody{color:#eef2f7}
.narr-panel .nmath{color:#60a5fa;font-family:monospace;margin-top:8px;font-size:12px}
footer{border-top:1px solid #223047;background:rgba(10,15,26,.95);padding:10px 14px;z-index:10}
#scale-row{display:flex;align-items:center;gap:10px;max-width:900px;margin:0 auto}
#scale-slider{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:6px;background:linear-gradient(90deg,#2dd4bf,#60a5fa,#fbbf24,#ef4444);outline:none;cursor:pointer}
#scale-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;cursor:grab;border:2px solid #2dd4bf;box-shadow:0 0 8px rgba(45,212,191,.6)}
#scale-slider::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;cursor:grab;border:2px solid #2dd4bf}
#autoplay-btn{padding:5px 12px;border:1px solid #2dd4bf;background:rgba(45,212,191,.12);color:#2dd4bf;border-radius:8px;cursor:pointer;font-size:11px;font-weight:700;white-space:nowrap}
#autoplay-btn.active{background:#2dd4bf;color:#071218}
#level-label{text-align:center;font-size:13px;font-weight:700;margin-top:3px}
#level-label .sub{color:#a8b3c7;font-size:11px;font-weight:400}
#retention-bar{width:100%;max-width:900px;margin:4px auto 0;height:5px;border-radius:5px;background:#1a2a3e;overflow:hidden}
#retention-fill{height:100%;width:100%;border-radius:5px;transition:width .3s,background .3s}
#retention-label{text-align:center;font-size:10px;color:#a8b3c7;margin-top:2px}
#retention-label .v{color:#2dd4bf;font-family:monospace;font-weight:700}
@media(max-width:768px){header h1{font-size:13px}header .sub{display:none}}
</style>
</head>
<body>
<div id="app">
  <header><h1>DREAM Zoom</h1><span class="sub">- operate the projection kernel in 3D</span><a class="home" href="/dream/en/index.html">DREAM</a></header>
  <div id="scene-container">
    <canvas id="three-canvas"></canvas>
    <div id="hud">
      <span class="pill"><span class="label">Scale</span> <span class="v" id="hud-scale">10^6 m</span></span>
      <span class="pill"><span class="label">R</span> <span class="v" id="hud-retention">1.000</span></span>
      <span class="pill"><span class="label">D</span> <span class="v" id="hud-d">0.80</span></span>
    </div>
    <div id="narrative"><div class="narr-panel" id="narr-panel">
      <div class="ntitle" id="narr-title">Galaxy</div>
      <div class="nbody" id="narr-body">At macroscopic scales, all structure is preserved.</div>
      <div class="nmath" id="narr-math">R = 1.000</div>
    </div></div>
  </div>
  <footer>
    <div id="scale-row">
      <span style="font-size:10px;color:#a8b3c7;white-space:nowrap">MACRO</span>
      <input type="range" id="scale-slider" min="0" max="1000" value="0" step="1">
      <span style="font-size:10px;color:#a8b3c7;white-space:nowrap">lambda_q</span>
      <button id="autoplay-btn" class="active">Auto</button>
    </div>
    <div id="level-label"><span id="level-name">Galaxy</span> <span class="sub" id="level-desc">- all structure preserved</span></div>
    <div id="retention-bar"><div id="retention-fill" style="width:100%;background:#2dd4bf"></div></div>
    <div id="retention-label">R = <span class="v" id="retention-value">1.000</span> - <span id="retention-meaning">all structure preserved</span></div>
  </footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
try {
if(typeof THREE==='undefined') throw new Error('THREE not loaded');

// S2 params
var LQ=1e-8, DEFF=0.80;
function retR(sl){return Math.max(0,Math.min(1,Math.exp(-Math.pow(Math.pow(10,sl)/LQ,DEFF))));}

// 10 levels, each with: slider value (0-1000), scale log10, name, description, narrative
var LEVELS=[
  {sv:0,   sl:6,   n:'Galaxy',          d:'all structure preserved',    t:'At macroscopic scales, all structure is preserved. The projection kernel has no measurable effect on the observable.'},
  {sv:120, sl:4.1, n:'Solar System',    d:'all structure preserved',    t:'Crossing from galactic to planetary scales. The Sun and planets are clearly resolved. Retention is still essentially unity.'},
  {sv:250, sl:2.0, n:'Earth',          d:'all structure preserved',    t:'Continental structure is fully resolved. Oceans, land masses, and cloud patterns are visible. The kernel is far above lambda_q.'},
  {sv:370, sl:0.1, n:'City',           d:'fine detail emerging',       t:'Urban-scale structure emerges. Buildings, streets, and districts are visible. The probe is approaching the regime where finer detail will start to degrade.'},
  {sv:490, sl:-1.8,n:'Room',           d:'objects visible',            t:'Human-scale objects are clearly resolved. Furniture, walls, a table with a lamp. The probe is still well above lambda_q.'},
  {sv:620, sl:-3.9,n:'Tabletop',       d:'surface texture emerging',    t:'The table surface fills the view. Wood grain begins to appear. The probe is approaching the coherence cliff -- retention is starting to drop.'},
  {sv:720, sl:-5.5,n:'Wood Grain',     d:'fine structure degrading',    t:'Wood grain is clearly visible but fine detail is degrading. R is dropping. The kernel is now actively erasing sub-resolution structure.'},
  {sv:830, sl:-7.3,n:'Fibers',         d:'structure collapsing',        t:'Cellular fiber strands are partially unresolved. The retention curve is steep here. Information is being lost rapidly. Fine fibers blur into each other.'},
  {sv:930, sl:-8.9,n:'Microstructure', d:'nearly unresolved',          t:'Only the coarsest fiber bundles survive. The projection has not become empty, but its recoverable information has reached its limit.'},
  {sv:1000,sl:-10, n:'Coherence Cliff',d:'irrecoverable',             t:'Below the coherence cliff, all structure is irrecoverably blurred. The kernel has averaged out everything. What remains is an unresolved field.'},
];

function s2sc(sv){
  // Non-linear mapping: dwell at each level, smooth transitions between
  // Each level has a slider value; we interpolate between them
  for(var i=0;i<LEVELS.length-1;i++){
    if(sv>=LEVELS[i].sv && sv<=LEVELS[i+1].sv){
      var frac=(sv-LEVELS[i].sv)/(LEVELS[i+1].sv-LEVELS[i].sv);
      // Ease in/out: slow at level boundaries, fast in between
      var eased=frac<0.5?2*frac*frac:1-Math.pow(-2*frac+2,2)/2;
      return LEVELS[i].sl+(LEVELS[i+1].sl-LEVELS[i].sl)*eased;
    }
  }
  return LEVELS[LEVELS.length-1].sl;
}
function findLvl(sv){
  // Find which level we're closest to
  var best=LEVELS[0];
  var bestDist=Math.abs(sv-LEVELS[0].sv);
  for(var i=1;i<LEVELS.length;i++){
    var d=Math.abs(sv-LEVELS[i].sv);
    if(d<bestDist){bestDist=d;best=LEVELS[i];}
  }
  return best;
}
function sup(n){return String(Math.round(n));}

// THREE scene
var container=document.getElementById('scene-container');
var canvas=document.getElementById('three-canvas');
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a1525);
scene.fog=new THREE.FogExp2(0x0a1525,0.0008);
var camera=new THREE.PerspectiveCamera(55,1,0.01,5000);
camera.position.set(0,40,160);
camera.lookAt(0,0,0);
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setClearColor(0x0a1525);
function resize(){var w=container.clientWidth,h=container.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();

// Bright lighting
var ambient=new THREE.AmbientLight(0xc0d0e0,1.4);scene.add(ambient);
var dl1=new THREE.DirectionalLight(0xffffff,1.5);dl1.position.set(60,120,80);scene.add(dl1);
var dl2=new THREE.DirectionalLight(0xffeecc,0.8);dl2.position.set(-60,40,-80);scene.add(dl2);
var dl3=new THREE.DirectionalLight(0x88aaff,0.5);dl3.position.set(0,-50,100);scene.add(dl3);

// ═══ GALAXY: bright central bulge + spiral arm bands ═══
var galaxyGroup=new THREE.Group();
// Central bulge - bright sphere
var bulge=new THREE.Mesh(new THREE.SphereGeometry(12,24,24),new THREE.MeshBasicMaterial({color:0xffffcc}));
galaxyGroup.add(bulge);
// Inner glow
var glow=new THREE.Mesh(new THREE.SphereGeometry(20,24,24),new THREE.MeshBasicMaterial({color:0x88aaff,side:THREE.BackSide}));
galaxyGroup.add(glow);
// Spiral arms - use 4 curved bands of particles
for(var arm=0;arm<4;arm++){
  var armOffset=arm*Math.PI/2;
  var aPos=new Float32Array(1000*3);
  var aCol=new Float32Array(1000*3);
  for(var j=0;j<1000;j++){
    var t=j/1000;
    var radius=15+Math.pow(t,0.4)*95;
    var angle=armOffset+radius*0.015+Math.random()*0.3;
    var spread=(Math.random()-0.5)*8;
    aPos[j*3]=Math.cos(angle)*radius+spread;
    aPos[j*3+1]=(Math.random()-0.5)*6*(1-radius/110);
    aPos[j*3+2]=Math.sin(angle)*radius+spread;
    var br=Math.random();
    if(br>0.7){aCol[j*3]=1;aCol[j*3+1]=1;aCol[j*3+2]=0.9;}
    else if(br>0.4){aCol[j*3]=0.7;aCol[j*3+1]=0.85;aCol[j*3+2]=1;}
    else{aCol[j*3]=0.4;aCol[j*3+1]=0.6;aCol[j*3+2]=0.9;}
  }
  var aGeom=new THREE.BufferGeometry();
  aGeom.setAttribute('position',new THREE.BufferAttribute(aPos,3));
  aGeom.setAttribute('color',new THREE.BufferAttribute(aCol,3));
  var armPts=new THREE.Points(aGeom,new THREE.PointsMaterial({size:4,vertexColors:true,depthWrite:false}));
  galaxyGroup.add(armPts);
}
scene.add(galaxyGroup);

// ═══ SOLAR SYSTEM: sun + planets as spheres ═══
var solarGroup=new THREE.Group();
// Sun
var sun=new THREE.Mesh(new THREE.SphereGeometry(8,24,24),new THREE.MeshBasicMaterial({color:0xffee44}));
solarGroup.add(sun);
var sunLight=new THREE.PointLight(0xffee44,3,200);
solarGroup.add(sunLight);
// Planets
var planets=[];
var planetData=[
  {r:14,s:1.5,c:0xaa6633},{r:20,s:2,c:0xddaa66},
  {r:28,s:2.5,c:0x4488cc},{r:36,s:2,c:0xcc5533},
  {r:50,s:4,c:0xddcc99},{r:62,s:3.5,c:0xddaa55},
  {r:74,s:2.5,c:0x88ccff},{r:84,s:2.5,c:0x4488dd}
];
for(i=0;i<planetData.length;i++){
  var pd=planetData[i];
  var p=new THREE.Mesh(new THREE.SphereGeometry(pd.s,16,16),new THREE.MeshLambertMaterial({color:pd.c,emissive:pd.c,emissiveIntensity:0.1}));
  p.position.set(pd.r,0,0);
  solarGroup.add(p);
  planets.push({mesh:p,radius:pd.r,speed:0.3/Math.sqrt(pd.r)});
  // Orbit ring
  var ringGeom=new THREE.RingGeometry(pd.r-0.2,pd.r+0.2,64);
  var ring=new THREE.Mesh(ringGeom,new THREE.MeshBasicMaterial({color:0x334466,side:THREE.DoubleSide}));
  ring.rotation.x=-Math.PI/2;
  solarGroup.add(ring);
}
solarGroup.visible=false;
scene.add(solarGroup);

// ═══ EARTH ═══
var eGeom=new THREE.IcosahedronGeometry(55,6);
var eCol=new Float32Array(eGeom.attributes.position.array.length);
for(i=0;i<eGeom.attributes.position.array.length;i+=3){
  var v=new THREE.Vector3(eGeom.attributes.position.array[i],eGeom.attributes.position.array[i+1],eGeom.attributes.position.array[i+2]);
  var n=v.clone().normalize();
  var ns=Math.sin(n.x*2.5)*Math.cos(n.y*3)*Math.sin(n.z*4)+Math.sin(n.x*7)*0.25;
  if(ns>0.2){eCol[i]=0.3;eCol[i+1]=0.65;eCol[i+2]=0.25;}
  else if(ns>-0.05){eCol[i]=0.55;eCol[i+1]=0.5;eCol[i+2]=0.25;}
  else{eCol[i]=0.15;eCol[i+1]=0.4;eCol[i+2]=0.65;}
}
eGeom.setAttribute('color',new THREE.BufferAttribute(eCol,3));
var earth=new THREE.Mesh(eGeom,new THREE.MeshLambertMaterial({vertexColors:true,emissive:0x102030,emissiveIntensity:0.3}));
earth.visible=false;scene.add(earth);
var atmo=new THREE.Mesh(new THREE.SphereGeometry(60,32,32),new THREE.MeshBasicMaterial({color:0x4488ff,side:THREE.BackSide}));
atmo.visible=false;scene.add(atmo);

// ═══ CITY ═══
var city=new THREE.Group();
for(i=0;i<40;i++){
  var h=5+Math.random()*28;
  var w=4+Math.random()*5;
  var d=4+Math.random()*5;
  var bc=new THREE.Color().setHSL(0.6,0.1,0.4+Math.random()*0.12);
  var bld=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:bc,emissive:bc,emissiveIntensity:0.1}));
  bld.position.set((Math.random()-0.5)*65,h/2,(Math.random()-0.5)*65);
  city.add(bld);
  if(Math.random()>0.2){
    var wc=new THREE.Color().setHSL(0.1+Math.random()*0.1,0.9,0.65);
    var win=new THREE.Mesh(new THREE.BoxGeometry(w*0.85,h*0.85,d*0.02),new THREE.MeshBasicMaterial({color:wc}));
    win.position.set(bld.position.x,h*0.45,bld.position.z+d/2+0.05);
    city.add(win);
  }
}
city.visible=false;scene.add(city);

// ═══ ROOM ═══
var room=new THREE.Group();
var floor=new THREE.Mesh(new THREE.PlaneGeometry(130,130),new THREE.MeshLambertMaterial({color:0x6a5232,emissive:0x2a1a08,emissiveIntensity:0.2}));
floor.rotation.x=-Math.PI/2;room.add(floor);
var bw=new THREE.Mesh(new THREE.PlaneGeometry(130,38),new THREE.MeshLambertMaterial({color:0x7a6a52,emissive:0x3a2a1a,emissiveIntensity:0.15}));
bw.position.set(0,19,-65);room.add(bw);
var lw=new THREE.Mesh(new THREE.PlaneGeometry(130,38),new THREE.MeshLambertMaterial({color:0x6a5a42,emissive:0x2a1a0a,emissiveIntensity:0.15}));
lw.position.set(-65,19,0);lw.rotation.y=Math.PI/2;room.add(lw);
var tableTop=new THREE.Mesh(new THREE.BoxGeometry(26,1.2,16),new THREE.MeshLambertMaterial({color:0xa0703c,emissive:0x402810,emissiveIntensity:0.2}));
tableTop.position.set(0,15,0);room.add(tableTop);
[[-11,-7],[11,-7],[-11,7],[11,7]].forEach(function(p){
  var leg=new THREE.Mesh(new THREE.BoxGeometry(1.2,15,1.2),new THREE.MeshLambertMaterial({color:0x805028,emissive:0x301810,emissiveIntensity:0.2}));
  leg.position.set(p[0],7.5,p[1]);room.add(leg);
});
var lampBase=new THREE.Mesh(new THREE.CylinderGeometry(2,2.5,1.5,20),new THREE.MeshLambertMaterial({color:0x555555}));
lampBase.position.set(-9,15.75,0);room.add(lampBase);
var lampPole=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,9,8),new THREE.MeshLambertMaterial({color:0x777777}));
lampPole.position.set(-9,21,0);room.add(lampPole);
var lampShade=new THREE.Mesh(new THREE.ConeGeometry(4.5,5,20,1,true),new THREE.MeshBasicMaterial({color:0xffeeaa,side:THREE.DoubleSide}));
lampShade.position.set(-9,24.5,0);room.add(lampShade);
var lampLight=new THREE.PointLight(0xffeeaa,2.5,80);lampLight.position.set(-9,23,0);room.add(lampLight);
var chairSeat=new THREE.Mesh(new THREE.BoxGeometry(6,1,6),new THREE.MeshLambertMaterial({color:0x554433}));
chairSeat.position.set(10,9,0);room.add(chairSeat);
var chairBack=new THREE.Mesh(new THREE.BoxGeometry(6,10,1),new THREE.MeshLambertMaterial({color:0x554433}));
chairBack.position.set(10,14,-2.5);room.add(chairBack);
room.visible=false;scene.add(room);

// ═══ WOOD GRAIN ═══
var woodGrain=new THREE.Group();
for(i=0;i<25;i++){
  var pts=[];var yB=(i-12)*0.35;
  for(var x=-11;x<=11;x+=0.05){var y=yB+Math.sin(x*1.2+i*0.3)*0.3+(Math.random()-0.5)*0.05;pts.push(new THREE.Vector3(x,y,0));}
  var lg=new THREE.BufferGeometry().setFromPoints(pts);
  var lm=new THREE.LineBasicMaterial({color:new THREE.Color().setHSL(0.08,0.7,0.35+i*0.012)});
  woodGrain.add(new THREE.Line(lg,lm));
}
woodGrain.visible=false;scene.add(woodGrain);

// ═══ FIBERS - line strands ═══
var fiberGroup=new THREE.Group();
for(i=0;i<150;i++){
  var fpts=[];var fa=Math.random()*Math.PI*2;var fr=Math.random()*12;var fh=(Math.random()-0.5)*10;var flen=3+Math.random()*5;
  for(var fi=0;fi<20;fi++){var ft=fi/19;fpts.push(new THREE.Vector3(fr*Math.cos(fa+ft*0.5),fh+ft*flen+Math.sin(ft*Math.PI*3)*1,fr*Math.sin(fa+ft*0.5)));}
  var fg=new THREE.BufferGeometry().setFromPoints(fpts);
  var fc=new THREE.Color().setHSL(0.08+Math.random()*0.08,0.7,0.4+Math.random()*0.2);
  fiberGroup.add(new THREE.Line(fg,new THREE.LineBasicMaterial({color:fc})));
}
fiberGroup.visible=false;scene.add(fiberGroup);

// ═══ UNRESOLVED FIELD — homogeneous slightly-discolored field ═══
// This is what you see BELOW the coherence cliff.
// Use a large sphere with a subtle gradient + many tiny particles to fill the view.
var unresolvedGroup=new THREE.Group();

// Large sphere that fills the view with a homogeneous slightly-discolored surface
var unresSphere=new THREE.Mesh(
  new THREE.SphereGeometry(80,32,32),
  new THREE.MeshBasicMaterial({color:0x1a2a3e})
);
unresolvedGroup.add(unresSphere);

// Inner glow sphere — slightly different color, like a uniform field
var unresGlow=new THREE.Mesh(
  new THREE.SphereGeometry(75,32,32),
  new THREE.MeshBasicMaterial({color:0x2a3a50,side:THREE.BackSide})
);
unresolvedGroup.add(unresGlow);

// Dense particle field filling the view — like a homogeneous unresolved field
var uPos=new Float32Array(2000*3);
var uCol=new Float32Array(2000*3);
for(i=0;i<2000;i++){
  uPos[i*3]=(Math.random()-0.5)*100;
  uPos[i*3+1]=(Math.random()-0.5)*100;
  uPos[i*3+2]=(Math.random()-0.5)*100;
  // Very subtle color variation — slightly discolored, not bright
  var uc=new THREE.Color().setHSL(0.58+Math.random()*0.04,0.15,0.2+Math.random()*0.06);
  uCol[i*3]=uc.r;uCol[i*3+1]=uc.g;uCol[i*3+2]=uc.b;
}
var uGeom=new THREE.BufferGeometry();
uGeom.setAttribute('position',new THREE.BufferAttribute(uPos,3));
uGeom.setAttribute('color',new THREE.BufferAttribute(uCol,3));
var unresolvedPts=new THREE.Points(uGeom,new THREE.PointsMaterial({size:2,vertexColors:true,depthWrite:false}));
unresolvedGroup.add(unresolvedPts);

unresolvedGroup.visible=false;
scene.add(unresolvedGroup);

// ═══ VISIBILITY ═══
function updateScene(sv,sl,R){
  // Camera: smooth lerp, centered
  var targetZ=160-(sv/1000)*130;
  camera.position.z+=(targetZ-camera.position.z)*0.06;
  var targetY=40-(sv/1000)*25;
  camera.position.y+=(targetY-camera.position.y)*0.06;
  camera.lookAt(0,5,0); // look slightly above center

  galaxyGroup.visible=(sl>3.5);
  galaxyGroup.rotation.y+=0.0003;

  solarGroup.visible=(sl<=3.5 && sl>0.8);
  if(solarGroup.visible){
    for(i=0;i<planets.length;i++){planets[i].mesh.position.x=Math.cos(Date.now()*0.0005*planets[i].speed+planetData[i].r)*planetData[i].r;planets[i].mesh.position.z=Math.sin(Date.now()*0.0005*planets[i].speed+planetData[i].r)*planetData[i].r;}
    solarGroup.rotation.y+=0.0002;
  }

  earth.visible=(sl<=0.8 && sl>-2.5);
  atmo.visible=earth.visible;
  earth.rotation.y+=0.0008;

  city.visible=(sl<=-1.5 && sl>-4.5);
  city.rotation.y+=0.0003;

  room.visible=(sl<=-3.5 && sl>-6.5);
  if(room.visible) lampLight.intensity=2+R*0.5;

  woodGrain.visible=(sl<=-5.5 && sl>-8.5);

  fiberGroup.visible=(sl<=-7 && sl>-10);

  unresolvedGroup.visible=(sl<=-8);
  if(unresolvedGroup.visible){
    unresolvedPts.material.size=2+(1-R)*3;
    unresolvedGroup.rotation.y+=0.0002;
  }

  scene.fog.density=0.0008+(1-R)*0.005;
  dl1.intensity=1.0+R*0.5;
  ambient.intensity=1.2+R*0.2;
}

// ═══ UI ═══
var slider=document.getElementById('scale-slider');
var autoBtn=document.getElementById('autoplay-btn');
var narrPanel=document.getElementById('narr-panel');
var narrTitle=document.getElementById('narr-title');
var narrBody=document.getElementById('narr-body');
var narrMath=document.getElementById('narr-math');
var hudScale=document.getElementById('hud-scale');
var hudR=document.getElementById('hud-retention');
var hudD=document.getElementById('hud-d');
var retFill=document.getElementById('retention-fill');
var retVal=document.getElementById('retention-value');
var retMeaning=document.getElementById('retention-meaning');
var lvlName=document.getElementById('level-name');
var lvlDesc=document.getElementById('level-desc');
var lastLvl='',narrTO=null;

var currentLevelIdx=0; // tracked by animate(), used by updateUI

function updateUI(sv,sl,R){
  var lvl=LEVELS[currentLevelIdx];
  hudScale.textContent='10^'+sup(sl)+' m';
  hudR.textContent=R.toFixed(3);
  hudD.textContent=DEFF.toFixed(2);
  retFill.style.width=(R*100)+'%';
  retVal.textContent=R.toFixed(3);
  var m,c;
  if(R>0.95){m='all structure preserved';c='#2dd4bf';}
  else if(R>0.7){m='fine detail emerging';c='linear-gradient(90deg,#fbbf24,#2dd4bf)';}
  else if(R>0.3){m='fine structure degrading';c='#fbbf24';}
  else if(R>0.05){m='structure collapsing';c='linear-gradient(90deg,#ef4444,#fbbf24)';}
  else{m='irrecoverable - below coherence cliff';c='#ef4444';}
  retMeaning.textContent=m;retFill.style.background=c;
  lvlName.textContent=lvl.n;lvlDesc.textContent='- '+lvl.d;
  if(lvl.n!==lastLvl){
    lastLvl=lvl.n;
    narrTitle.textContent=lvl.n;
    narrBody.textContent=lvl.t;
    narrMath.textContent='R = exp[-(lambda/lambda_q)^D] = '+R.toFixed(3);
    narrPanel.classList.add('visible');
    if(narrTO)clearTimeout(narrTO);
    narrTO=setTimeout(function(){narrPanel.classList.remove('visible');},9000);
  }
}

// ═══ ANIMATION ═══
var autoZoom=true;
var autoStartTime=Date.now();
var DWELL_MS=9000; // 9 seconds per level
var LAST_DWELL_MS=15000; // 15 seconds for the final coherence cliff level
var TRANSITION_MS=2000; // 2 second transition
var TOTAL_MS=(DWELL_MS+TRANSITION_MS)*(LEVELS.length-1)+LAST_DWELL_MS+TRANSITION_MS; // longer for final level

function animate(){
  requestAnimationFrame(animate);
  if(autoZoom){
    var elapsed=(Date.now()-autoStartTime)%TOTAL_MS;
    var accumMs=0;
    var levelIdx=0;
    var inLevel=0;
    for(var li=0;li<LEVELS.length;li++){
      var dwell=li===LEVELS.length-1?LAST_DWELL_MS:DWELL_MS;
      if(elapsed<accumMs+dwell+TRANSITION_MS){
        levelIdx=li;
        inLevel=elapsed-accumMs;
        break;
      }
      accumMs+=dwell+TRANSITION_MS;
    }
    var dwell=levelIdx===LEVELS.length-1?LAST_DWELL_MS:DWELL_MS;
    currentLevelIdx=levelIdx; // track for UI sync
    if(inLevel<dwell){
      slider.value=LEVELS[levelIdx].sv;
    } else {
      var t=(inLevel-dwell)/TRANSITION_MS;
      if(levelIdx<LEVELS.length-1){
        slider.value=LEVELS[levelIdx].sv+(LEVELS[levelIdx+1].sv-LEVELS[levelIdx].sv)*t;
      } else {
        if(t>0.5){autoStartTime=Date.now();}
        slider.value=0;
      }
    }
  }
  var sv=parseFloat(slider.value);
  var sl=s2sc(sv);
  var R=retR(sl);
  // If manual mode, find level by midpoint boundaries
  if(!autoZoom){
    currentLevelIdx=0;
    for(var mi=0;mi<LEVELS.length-1;mi++){
      var mid=(LEVELS[mi].sv+LEVELS[mi+1].sv)/2;
      if(sv>mid) currentLevelIdx=mi+1;
    }
  }
  updateScene(sv,sl,R);
  updateUI(sv,sl,R);
  renderer.render(scene,camera);
}

// ═══ INTERACTION ═══
slider.addEventListener('input',function(){autoZoom=false;autoBtn.classList.remove('active');});
autoBtn.addEventListener('click',function(){autoZoom=!autoZoom;autoBtn.classList.toggle('active',autoZoom);if(autoZoom)autoStartTime=Date.now();});
canvas.addEventListener('click',function(){autoZoom=!autoZoom;autoBtn.classList.toggle('active',autoZoom);if(autoZoom)autoStartTime=Date.now();});
var pD=0;
canvas.addEventListener('touchstart',function(e){if(e.touches.length===2)pD=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:true});
canvas.addEventListener('touchmove',function(e){if(e.touches.length===2&&pD>0){e.preventDefault();var nd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);var d=(nd-pD)/pD;var v=parseFloat(slider.value)-d*60;v=Math.max(0,Math.min(1000,v));slider.value=v;autoZoom=false;autoBtn.classList.remove('active');pD=nd;}},{passive:false});

animate();
setTimeout(function(){narrPanel.classList.add('visible');},500);
setTimeout(function(){narrPanel.classList.remove('visible');},9000);

} catch(e) {
  document.body.innerHTML='<div style="padding:20px;color:#fca5a5;font-family:monospace">ERROR: '+e.message+'</div>';
  console.error(e);
}
</script>
